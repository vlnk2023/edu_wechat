<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立体几何有什么用？</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:#183153;font-family:"Microsoft YaHei",sans-serif}.wrap{max-width:940px;margin:auto;padding:34px 20px 55px}h1{text-align:center;font-size:clamp(30px,6vw,54px);margin:0;color:#2754a5}h2{text-align:center;font-weight:500;font-size:22px;margin:14px 0 34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 7px 22px #b9c8e655;font-size:18px;line-height:1.7}.pic{font-size:65px;text-align:center;margin:3px 0 10px}.card h3{margin:0;text-align:center;color:#e17232;font-size:23px}.bottom{margin-top:26px;background:#2754a5;color:#fff;border-radius:22px;padding:25px;font-size:22px;line-height:1.7;text-align:center}.cube{width:75px;height:75px;margin:15px auto 0;border:5px solid #8be0fa;transform:skewY(-20deg);border-radius:6px}</style>
<body><main class="wrap"><h1>立体几何，有什么用？</h1><h2>它研究的是有“长、宽、高”的真实物体。</h2><section class="grid"><article class="card"><div class="pic">🏠</div><h3>盖房子</h3><p>房间有多大？斜屋顶要多长？柱子够不够高？都要算空间里的长度、角度和面积。</p></article><article class="card"><div class="pic">📦</div><h3>装东西</h3><p>一个纸箱能装几瓶水？快递要用多大的箱子？这是在算<strong>体积</strong>。</p></article><article class="card"><div class="pic">🎮</div><h3>做游戏和动画</h3><p>游戏里的汽车、人物和城堡像真的，是因为电脑在计算 3D 物体的位置和旋转。</p></article><article class="card"><div class="pic">🧭</div><h3>导航与工程</h3><p>无人机飞行、桥梁设计、机器人抓东西，都要知道物体在空间中的方向和距离。</p></article></section><div class="bottom">平面几何像在纸上画图。<br>立体几何则是把图“拿起来”，理解真实世界！<div class="cube"></div><small>它还能训练空间想象力和解决问题的能力。</small></div></main></body></html>
