<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>微观化学反应秒懂</title>
  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f0fdf4;
      color: #166534;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 680px;
      margin: auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(22, 101, 52, 0.12);
    }
    h1 {
      text-align: center;
      color: #15803d;
      font-size: 32px;
      margin: 6px 0;
    }
    h2 {
      text-align: center;
      color: #854d0e;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .diagram-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 18px;
      border: 2px dashed #bbf7d0;
    }
    .diagram-svg {
      width: 100%;
      max-width: 420px;
      height: auto;
    }
    .result {
      background: #dcfce7;
      color: #14532d;
      border-radius: 14px;
      padding: 14px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 18px;
    }
    ul {
      padding-left: 20px;
      font-size: 17px;
      line-height: 1.9;
      color: #1f2937;
    }
    .tip {
      background: #fef9c3;
      color: #713f12;
      padding: 14px 18px;
      border-radius: 12px;
      margin-top: 18px;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>一眼看懂微观化学变化</h1>
    <h2>看小球拼装，秒选正确方程式</h2>

    <div class="diagram-card">
      <svg class="diagram-svg" viewBox="0 0 420 110" xmlns="http://www.w3.org/2000/svg">
        <!-- 2 个黑球双分子 -->
        <circle cx="40" cy="30" r="14" fill="#334155"/>
        <circle cx="64" cy="30" r="14" fill="#334155"/>
        <circle cx="40" cy="70" r="14" fill="#334155"/>
        <circle cx="64" cy="70" r="14" fill="#334155"/>
        <text x="52" y="100" font-size="12" fill="#64748b" text-anchor="middle">2个双黑球(2H₂)</text>

        <!-- + -->
        <text x="110" y="58" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="middle">+</text>

        <!-- 1 个白球双分子 -->
        <circle cx="160" cy="38" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <circle cx="160" cy="62" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <text x="160" y="100" font-size="12" fill="#64748b" text-anchor="middle">1个双白球(O₂)</text>

        <!-- -> -->
        <text x="220" y="58" font-size="24" font-weight="bold" fill="#3b82f6" text-anchor="middle">→</text>

        <!-- 2 个白黑白三分子 -->
        <circle cx="280" cy="30" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <circle cx="302" cy="30" r="14" fill="#334155"/>
        <circle cx="324" cy="30" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

        <circle cx="280" cy="70" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <circle cx="302" cy="70" r="14" fill="#334155"/>
        <circle cx="324" cy="70" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <text x="302" y="100" font-size="12" fill="#64748b" text-anchor="middle">2个三球分子(2H₂O)</text>
      </svg>
    </div>

    <div class="result">
      正确选项：A（2H₂ + O₂ ──点燃──→ 2H₂O）
    </div>

    <ul>
      <li><b>同种小球绑在一起</b>：叫单质（左边两个都是单质，排除 CO、CO₂ 这类化合物）。</li>
      <li><b>数分子个数</b>：左边是 2 个 + 1 个，右边生成 2 个，配平系数必须是 <b>2 : 1 : 2</b>。</li>
      <li><b>生成物构成</b>：每个分子由 3 个原子组成（H₂O 正好是 2个H + 1个O）。</li>
    </ul>

    <div class="tip">
      💡 <b>速记口诀</b>：同色为单质，异色为化合；前数分子比，后对原子数！
    </div>
  </div>
</body>
</html>
