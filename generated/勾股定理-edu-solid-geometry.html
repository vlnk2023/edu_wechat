<style>body{margin:0;background:#f3f7ff;color:#18345b;font-family:"Microsoft YaHei",Arial,sans-serif}.page{max-width:900px;margin:auto;padding:28px 18px 45px}h1{text-align:center;color:#245bb0;font-size:clamp(30px,6vw,52px);margin:4px}h2{text-align:center;font-weight:400;margin:8px 0 25px}.card{background:#fff;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 8px 22px #b7c8e855}.formula{text-align:center;font-size:38px;font-weight:bold;color:#245bb0;background:#eaf2ff;padding:18px;border-radius:14px}.diagram{display:block;margin:5px auto;width:min(100%,430px);height:auto}.step{font-size:19px;line-height:1.8}.tag{display:inline-block;background:#ffe5cf;color:#a34c15;border-radius:9px;padding:2px 9px;font-weight:bold}.example{font-size:21px;text-align:center;background:#fff5d9;border-radius:14px;padding:15px}.note{text-align:center;font-size:18px;color:#4c6688}</style>
<div class="page"><h1>勾股定理</h1><h2>直角三角形里的“长度密码”</h2><section class="card"><svg class="diagram" viewBox="0 0 430 280" role="img" aria-label="直角三角形"><polygon points="65,225 65,55 365,225" fill="#eaf5ff" stroke="#2767b8" stroke-width="5"/><polyline points="65,205 85,205 85,225" fill="none" stroke="#e47735" stroke-width="4"/><text x="42" y="145" font-size="24" fill="#e47735">b</text><text x="210" y="250" font-size="24" fill="#245bb0">a</text><text x="220" y="125" font-size="24" fill="#39934a">c（斜边）</text></svg><div class="formula">a² + b² = c²</div><p class="note">只适用于有一个 90° 直角的三角形。</p></section><section class="card step"><p><span class="tag">第1步</span> 找到直角。直角对面的边一定是最长的，叫<strong>斜边</strong>。</p><p><span class="tag">第2步</span> 两条直角边分别是 a、b，斜边是 c。</p><p><span class="tag">第3步</span> 两条短边的平方相加，就得到斜边的平方。</p></section><section class="card example"><strong>例题：直角边是 3 和 4，斜边是多少？</strong><br><br>3² + 4² = 9 + 16 = 25 = 5²<br><br>所以斜边 <strong>c = 5</strong>。</section><section class="card step"><strong>它有什么用？</strong><br>测量不能直接走的距离、计算梯子长度、房屋斜顶、地图上的直线距离等。</section></div></html>
