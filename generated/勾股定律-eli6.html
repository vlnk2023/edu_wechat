<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勾股定律</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f4f8ff;color:#17345e;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:white;border-radius:24px;padding:25px;box-shadow:0 8px 25px #b8c8e866}h1{text-align:center;color:#2460b5;font-size:42px;margin:8px}h2{text-align:center;color:#e47735}.formula{text-align:center;font-size:36px;font-weight:bold;color:#2460b5;background:#eaf3ff;border-radius:15px;padding:18px;margin:20px 0}.tri{position:relative;width:280px;height:190px;margin:25px auto;border-left:5px solid #ed7d31;border-bottom:5px solid #ed7d31}.tri:after{content:'';position:absolute;left:0;bottom:0;width:280px;height:190px;border-top:5px solid #43a047;transform:rotate(-34deg);transform-origin:left bottom}.label{position:absolute;font-weight:bold;font-size:23px}.a{left:125px;bottom:-38px;color:#2460b5}.b{left:-35px;bottom:75px;color:#e47735}.c{right:65px;top:35px;color:#43a047}li{font-size:20px;line-height:1.8}.tip{background:#fff4d8;padding:15px;border-radius:14px;font-size:19px}</style><div class="box"><h1>勾股定律</h1><h2>专门用于直角三角形</h2><div class="tri"><span class="label a">a</span><span class="label b">b</span><span class="label c">c</span></div><div class="formula">a² + b² = c²</div><ul><li><b>a、b</b>：直角旁边的两条短边</li><li><b>c</b>：对着直角的最长边，叫斜边</li><li>两条短边的平方加起来，等于斜边的平方</li></ul><div class="tip">例：两条直角边是 3 和 4，那么斜边就是 5，因为 3²+4²=5²。</div></div></html>
